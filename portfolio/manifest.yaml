schema_version: 2
product_id: product.nicos-hidden-menubar
visibility: public
reviewed: true
presentation:
    summary: A native, local-first macOS menu-bar organizer with transparent diagnostics.
    detail: Hide infrequently used items behind a native toggle, search and recover them below the menu bar, and validate the visible result across regular and notched displays.
    language: Swift
    lane: Native macOS product engineering
access:
    profile: macos-app
    primary_action:
        kind: source
        label: Build Nicos Hidden Bar
        url: https://github.com/nstranquist/nicos-hidden-menubar#install-from-source
    repository_url: https://github.com/nstranquist/nicos-hidden-menubar
    documentation_url: https://github.com/nstranquist/nicos-hidden-menubar#first-run-setup
    feedback_url: https://github.com/nstranquist/nicos-hidden-menubar/issues/new
    smoke_argv: [make, headless-smoke]
proof:
    claims:
        - id: rendered-item-verification
          statement: The app verifies rendered menu-bar items instead of treating a process request as proof of a visible result.
          evidence_kind: documentation
          evidence_url: https://github.com/nstranquist/nicos-hidden-menubar#architecture-and-tradeoffs
        - id: native-headless-smoke
          statement: The repository includes a native headless settings smoke and a publication verification gate.
          evidence_kind: test
          evidence_url: https://github.com/nstranquist/nicos-hidden-menubar#development
    boundaries:
        - The public release contains source and no notarized downloadable application binary.
        - Optional synthesized item movement stays off until the user enables it.
assets:
    - path: docs/assets/preferences-window.png
      kind: screenshot
      alt: Nicos Hidden Menubar preferences window
      caption: Privacy-reviewed macOS preferences UI captured by the native headless smoke.
      public: true
      provenance: native-headless-smoke-capture
      copyright_owner: Nico Stranquist
    - path: assets/brand/nicos-hidden-menubar.svg
      kind: logo
      alt: Nicos Hidden Bar application icon
      provenance: authored-svg
      copyright_owner: Nico Stranquist
      generator: catalog-brand-svg/v2
      concept: hidden-menu
      score: 100
case_study:
    enabled: false
    evidence: []
