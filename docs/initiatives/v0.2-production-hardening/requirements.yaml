schema_version: 1
initiative_id: nhm-v0.2-production-hardening
title: Nicos Hidden Bar v0.2 Production Hardening
status: proposed
owner: "@nstranquist"
requirements:
  - id: ARC-001
    group: architecture
    priority: must
    state: verified
    title: Extract a testable state machine and services
    statement: The central controller delegates pure transitions and side effects to bounded owners.
    design_ref: architecture/overview.md#target-boundaries
    acceptance:
      - id: ARC-001-A
        type: automated
        statement: State transitions run without AppKit or a window server.
      - id: ARC-001-B
        type: structural
        statement: Activation, capture, placement, and diagnostics have separate owners.
    evidence:
      - acceptance_id: ARC-001-A
        kind: commit
        ref: git:722da6c201e940d1a9acd0841422a9af925f7a03
        observed_at: 2026-07-11
      - acceptance_id: ARC-001-A
        kind: test
        ref: file:docs/initiatives/v0.2-production-hardening/receipts/ARC-001.json
        observed_at: 2026-07-11
      - acceptance_id: ARC-001-B
        kind: commit
        ref: git:b735e93ead311bb5b8838d045f3131ac57f55247
        observed_at: 2026-07-12
      - acceptance_id: ARC-001-B
        kind: commit
        ref: git:20b6f744aee8b6ec62c85e3f003a03beba2bd757
        observed_at: 2026-07-12
      - acceptance_id: ARC-001-B
        kind: test
        ref: file:docs/initiatives/v0.2-production-hardening/receipts/ARC-001.json
        observed_at: 2026-07-12
    risks: [migration-regression]

  - id: ITEM-001
    group: identity
    priority: must
    state: accepted
    title: Versioned stable item identity
    statement: Repeated and image-only items resolve to distinct durable identities.
    design_ref: decisions/0003-stable-item-identity.md
    acceptance:
      - id: ITEM-001-A
        type: automated
        statement: Fixtures distinguish supported Control Center modules.
      - id: ITEM-001-B
        type: migration
        statement: Existing bundle-title policy migrates without silent loss.
    evidence:
      - acceptance_id: ITEM-001-A
        kind: test
        ref: file:Tests/NicosHiddenMenuBarTests/ItemIdentityTests.swift
        observed_at: 2026-07-14
      - acceptance_id: ITEM-001-B
        kind: test
        ref: file:Tests/NicosHiddenMenuBarTests/ItemIdentityTests.swift
        observed_at: 2026-07-14
    risks: [os-metadata-drift, ambiguous-legacy-identity]

  - id: HIDE-001
    group: collapse
    priority: must
    state: accepted
    title: Verified permission-free section collapse
    statement: Collapse hides every rendered hidden-lane item while preserving visible standalone items, and any unverified transition remains expanded without automatic item movement.
    design_ref: decisions/0005-verified-spacer-primary.md
    acceptance:
      - id: HIDE-001-A
        type: automated
        statement: Exact-ID verification excludes menu-bar chrome and rejects partial or empty hide results.
      - id: HIDE-001-B
        type: hardware
        statement: Repeated collapse and restore cycles pass on the built-in notched display.
      - id: HIDE-001-C
        type: degraded
        statement: Verification failure releases the spacer and does not mutate third-party item positions.
    evidence:
      - acceptance_id: HIDE-001-A
        kind: test
        ref: file:Tests/NicosHiddenMenuBarTests/MarkerGeometryTests.swift
        observed_at: 2026-07-29
      - acceptance_id: HIDE-001-A
        kind: test
        ref: file:Tests/NicosHiddenMenuBarTests/ItemIdentityTests.swift
        observed_at: 2026-07-29
      - acceptance_id: HIDE-001-B
        kind: hardware
        ref: file:docs/initiatives/v0.2-production-hardening/receipts/HIDE-001.json
        observed_at: 2026-07-29
        machine: MacBookPro18,1 Apple M1 Pro 16 GB
        os_version: macOS 15.7.7 (24G720)
        display_topology: built-in 3456x2234 Liquid Retina XDR main display
      - acceptance_id: HIDE-001-C
        kind: test
        ref: file:Tests/NicosHiddenMenuBarTests/MarkerGeometryTests.swift
        observed_at: 2026-07-29
    risks: [private-api-drift, status-item-layout-drift]

  - id: ACT-001
    group: activation
    priority: must
    state: accepted
    title: Activate an item from the reveal panel
    statement: Selecting a panel item opens its menu or returns an explicit actionable outcome.
    design_ref: architecture/item-lifecycle.md#target-activation-contract
    acceptance:
      - id: ACT-001-A
        type: automated
        statement: Controller routes selection through ItemActivationService.
      - id: ACT-001-B
        type: hardware
        statement: One third-party item and one supported Control Center item activate on a notched Mac.
      - id: ACT-001-C
        type: degraded
        statement: Missing permission produces an explicit repair action.
    evidence:
      - acceptance_id: ACT-001-A
        kind: test
        ref: file:Tests/NicosHiddenMenuBarTests/MenuBarServiceBoundaryTests.swift
        observed_at: 2026-07-14
      - acceptance_id: ACT-001-C
        kind: test
        ref: file:Tests/NicosHiddenMenuBarTests/MenuBarServiceBoundaryTests.swift
        observed_at: 2026-07-14
    risks: [accessibility-permission, private-api-drift]

  - id: MOVE-001
    group: placement
    priority: must
    state: accepted
    title: Bounded item movement and recovery
    statement: Movement waits for observed frames, retries within a fixed budget, and restores state on failure.
    design_ref: decisions/0002-item-manager-replaces-spacer.md
    acceptance:
      - id: MOVE-001-A
        type: automated
        statement: Retry, timeout, cancellation, and rollback transitions are deterministic.
      - id: MOVE-001-B
        type: hardware
        statement: Supported third-party owners pass repeated move-and-restore smoke.
    evidence:
      - acceptance_id: MOVE-001-A
        kind: test
        ref: file:Tests/NicosHiddenMenuBarTests/PlacementEngineTests.swift
        observed_at: 2026-07-14
    risks: [owner-latency, user-layout-mutation]

  - id: DSP-001
    group: displays
    priority: must
    state: accepted
    title: Per-display placement ownership
    statement: Each display topology resolves independent live geometry and panel placement.
    design_ref: decisions/0002-item-manager-replaces-spacer.md
    acceptance:
      - id: DSP-001-A
        type: automated
        statement: Offset, scaled, attached, removed, and resized display transitions are covered.
      - id: DSP-001-B
        type: hardware
        statement: Built-in notch plus an external display pass the compatibility matrix.
    evidence:
      - acceptance_id: DSP-001-A
        kind: test
        ref: file:Tests/NicosHiddenMenuBarTests/DisplayGeometryTests.swift
        observed_at: 2026-07-29
    risks: [status-item-replica-behavior]

  - id: CAP-001
    group: capture
    priority: should
    state: accepted
    title: Incremental bounded icon capture
    statement: The panel opens before capture completes and fills icons incrementally from a bounded cache.
    design_ref: decisions/0004-panel-capture-and-cache.md
    acceptance:
      - id: CAP-001-A
        type: automated
        statement: Cache invalidation and byte/count limits are tested.
      - id: CAP-001-B
        type: performance
        statement: Warm and cold reveal meet documented latency budgets.
    evidence:
      - acceptance_id: CAP-001-A
        kind: test
        ref: file:Tests/NicosHiddenMenuBarTests/IconCacheTests.swift
        observed_at: 2026-07-14
    risks: [screen-recording-permission, capture-latency]

  - id: TEST-001
    group: quality
    priority: must
    state: accepted
    title: Integration and lifecycle coverage
    statement: Automated coverage includes controller effects, panel lifecycle, permissions, and display changes.
    design_ref: quality/test-matrix.md
    acceptance:
      - id: TEST-001-A
        type: automated
        statement: Every must requirement has at least one automated acceptance test.
      - id: TEST-001-B
        type: ci
        statement: Required tests run on a clean macOS CI host.
    evidence:
      - acceptance_id: TEST-001-A
        kind: test
        ref: file:Tests/NicosHiddenMenuBarTests/MenuBarServiceBoundaryTests.swift
        observed_at: 2026-07-29
    risks: [hardware-only-coverage]

  - id: PERF-001
    group: performance
    priority: must
    state: accepted
    title: Enforced resource budgets
    statement: Idle CPU, physical memory, reveal latency, and capture cache have measurable gates.
    design_ref: quality/performance-budgets.md
    acceptance:
      - id: PERF-001-A
        type: automated
        statement: Budget checks produce machine-readable pass or fail output.
      - id: PERF-001-B
        type: hardware
        statement: Release candidate meets budgets on the baseline M1 MacBook Pro.
    evidence:
      - acceptance_id: PERF-001-A
        kind: test
        ref: file:Tests/NicosHiddenMenuBarTests/PerformanceMetricsTests.swift
        observed_at: 2026-07-29
      - acceptance_id: PERF-001-A
        kind: test
        ref: file:Tests/NicosHiddenMenuBarTests/IconCacheTests.swift
        observed_at: 2026-07-29
      - acceptance_id: PERF-001-A
        kind: performance
        ref: file:docs/initiatives/v0.2-production-hardening/receipts/PERF-001.json
        observed_at: 2026-07-29
      - acceptance_id: PERF-001-B
        kind: hardware
        ref: file:docs/initiatives/v0.2-production-hardening/receipts/PERF-001.json
        observed_at: 2026-07-29
        machine: MacBookPro18,1 Apple M1 Pro 16 GB
        os_version: macOS 15.7.7 (24G720)
        display_topology: built-in 3456x2234 Liquid Retina XDR main display
    risks: [measurement-variance]

  - id: REL-001
    group: release
    priority: must
    state: accepted
    title: Reproducible signed release pipeline
    statement: CI validates source and produces versioned release evidence; distribution uses stable signing and notarization.
    design_ref: releases/release-checklist.md
    acceptance:
      - id: REL-001-A
        type: ci
        statement: Tests, formatting, warnings, docs validation, and forbidden-term audit gate pull requests.
      - id: REL-001-B
        type: release
        statement: Signed, notarized, stapled artifact passes clean-machine install and permission smoke.
    evidence: []
    risks: [developer-id-availability]

  - id: DOC-001
    group: documentation
    priority: should
    state: implemented
    title: Traceable product documentation
    statement: Product promise, decisions, requirements, tests, evidence, and releases remain linked and current.
    design_ref: INDEX.md#lifecycle-rules
    acceptance:
      - id: DOC-001-A
        type: automated
        statement: Requirement schema and relative links validate in CI.
      - id: DOC-001-B
        type: review
        statement: Frozen historical contracts are not rewritten to hide deviations.
    evidence:
      - acceptance_id: DOC-001-A
        kind: commit
        ref: git:951ff914218bfb0488797033adc5e7ef41b3ccb0
        observed_at: 2026-07-11
      - acceptance_id: DOC-001-A
        kind: test
        ref: file:docs/initiatives/v0.2-production-hardening/receipts/DOC-001.json
        observed_at: 2026-07-11
      - acceptance_id: DOC-001-B
        kind: review
        ref: file:docs/initiatives/v0.2-production-hardening/receipts/DOC-001.json
        observed_at: 2026-07-11
    risks: [documentation-drift]
