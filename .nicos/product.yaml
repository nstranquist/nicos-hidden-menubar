schema_version: 1
id: product.nicos-hidden-menubar
name: Nicos Hidden Bar
surface: products
kind: product
status: shipped
persona: Mac users and developers with crowded menu bars who want a local-first, open-source organizer with transparent diagnostics.
jtbd: Hide infrequently used menu-bar items behind one native toggle while keeping them quickly searchable and recoverable on notched displays.
competitor: Hidden Bar, Ice, Bartender
pricing: Free and open source.
launch: built
launch_blocker: "/Applications/NicosHiddenMenuBar.app is Developer ID signed, notarized, and stapled (C82D23RNQ9, 2026-08-19). Gatekeeper accepts Notarized Developer ID. Accessibility TCC needs one re-grant for the Developer ID identity (was Apple Development). Remaining: public GitHub release of the notarized binary."
license: GPL-3.0
refs:
    - kind: documented_by
      target: doc.apple-developer-program-membership
    - kind: reads
      target: capability.apple-distribution
tags:
    - macos
    - swift
    - appkit
    - swiftui
    - menubar
    - utility
    - privacy
    - oss
    - portfolio
checks:
    - name: publication
      command:
        - make
        - verify-publication
    - name: headless-smoke
      command:
        - make
        - headless-smoke
description: Native macOS menu-bar organizer with standalone visible items plus hidden and always-hidden regions; exact rendered-item verification for permission-free spacer collapse on notched and regular displays; a searchable below-menu-bar reveal panel; adaptive multi-display sizing; auto-collapse profiles; global shortcut; local JSON diagnostics; and opt-in synthesized item movement for explicit placement.
portfolio_manifest: portfolio/manifest.yaml
